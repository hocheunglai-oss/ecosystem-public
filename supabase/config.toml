project_id = "ecosystem-demo"

[auth]
enabled = true
site_url = "https://eco.fcuno.com"
additional_redirect_urls = []
jwt_expiry = 900
enable_signup = false
enable_anonymous_sign_ins = false
enable_manual_linking = false
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
minimum_password_length = 8
password_requirements = "lower_upper_letters_digits"

[auth.email]
# This enables the email/password provider; auth.enable_signup above still blocks public registration.
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true
max_frequency = "1m"
otp_expiry = 3600

[auth.email.template.invite]
subject = "Set your ECO password"
content_path = "./supabase/templates/invite.html"

[auth.email.template.recovery]
subject = "Reset your ECO password"
content_path = "./supabase/templates/recovery.html"

[auth.sessions]
# Keep sessions until explicit logout or a security revocation. Access tokens still rotate.
timebox = "0s"
inactivity_timeout = "0s"

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true
