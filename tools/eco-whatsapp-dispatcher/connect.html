<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>ECO WhatsApp Dispatcher</title>
<style>
:root { color-scheme: light dark; font: 14px system-ui, sans-serif }
body { box-sizing: border-box; width: 300px; padding: 12px }
h1 { font-size: 16px; margin-top: 0 }
label { display: grid; gap: 6px }
input, button { box-sizing: border-box; width: 100%; font: inherit; min-height: 36px; margin-bottom: 8px }
</style>
<h1>ECO WHATSAPP DISPATCHER</h1>
<form>
  <label>CONNECTION CODE<input type="password" required autocomplete="off" spellcheck="false"></label>
  <button>CONNECT</button>
</form>
<button id="pause" type="button" hidden>PAUSE</button>
<p role="status"></p>
<script src="connect.js"></script>
</html>
